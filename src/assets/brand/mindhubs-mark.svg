<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" class="mh-mark" aria-hidden="true" focusable="false">
  <style>
    .mh-mark {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .mh-link {
      fill: none;
      stroke: var(--mindhubs-mark-link, #18DCFF);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mh-node {
      fill: var(--mindhubs-mark-node, #6EE7FF);
    }

    @media (prefers-color-scheme: light) {
      .mh-mark:not([data-variant]) {
        --mindhubs-mark-node: #087F95;
        --mindhubs-mark-link: #087F95;
      }
    }
  </style>
  <path class="mh-link" d="M12 6.25 7.25 14.75M12 6.25l4.75 8.5M7.25 16.75h9.5" />
  <circle class="mh-node" cx="12" cy="5.25" r="2.15" />
  <circle class="mh-node" cx="6.25" cy="16" r="2.15" />
  <circle class="mh-node" cx="17.75" cy="16" r="2.15" />
</svg>
